<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Tafel Rush promo</title>
<style>
@font-face { font-family: 'Unbounded'; font-weight: 900; src: url('../../node_modules/@expo-google-fonts/unbounded/900Black/Unbounded_900Black.ttf'); }
@font-face { font-family: 'Unbounded'; font-weight: 800; src: url('../../node_modules/@expo-google-fonts/unbounded/800ExtraBold/Unbounded_800ExtraBold.ttf'); }
@font-face { font-family: 'DM Sans'; font-weight: 700; src: url('../../node_modules/@expo-google-fonts/dm-sans/700Bold/DMSans_700Bold.ttf'); }
@font-face { font-family: 'DM Sans'; font-weight: 500; src: url('../../node_modules/@expo-google-fonts/dm-sans/500Medium/DMSans_500Medium.ttf'); }
:root {
  --bg: #101018; --surface: #1C1C28; --line: #2E2E40; --text: #F4F4F8; --muted: #A0A0B8;
  --lime: #C6FF3D; --pink: #FF3D8B; --orange: #FF9F1C; --cyan: #3DDCFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); overflow: hidden; }
#stage { position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
.abs { position: absolute; }
.disp { font-family: 'Unbounded', sans-serif; font-weight: 900; }
.center { left: 0; right: 0; text-align: center; }
.glitch { position: relative; display: inline-block; }
.glitch .g { position: absolute; left: 0; top: 0; white-space: nowrap; }
#flash { inset: 0; pointer-events: none; }
#bgfx { inset: 0; }
#cap { font-family: 'Unbounded', sans-serif; font-weight: 800; line-height: 1.12; letter-spacing: -0.01em; display: flex; align-items: center; }
#cap span.hl { color: var(--lime); }
/* phone */
#phone { width: 640px; height: 1240px; border-radius: 84px; border: 10px solid var(--lime); background: var(--surface); transform-origin: 0 0; overflow: hidden; }
#screen { position: absolute; inset: 12px; border-radius: 70px; background: var(--bg); overflow: hidden; }
.pill { display: inline-block; border-radius: 999px; padding: 10px 22px; font-family: 'Unbounded'; font-weight: 800; font-size: 24px; }
.bubble { border-radius: 36px; padding: 26px 34px; font-family: 'DM Sans'; font-weight: 700; font-size: 42px; white-space: nowrap; }
#grid { width: 900px; height: 1040px; transform-origin: 0 0; }
.cell { position: absolute; width: 80px; height: 80px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans'; font-weight: 700; font-size: 19px; }
#card { width: 860px; height: 900px; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bgfx" class="abs"></div>

  <!-- scene 1 -->
  <div id="s1" class="abs" style="inset:0">
    <div id="s1a" class="abs center disp"></div>
    <div id="s1b" class="abs center disp"></div>
    <div id="s1strike" class="abs" style="background:var(--pink);border-radius:12px"></div>
  </div>

  <!-- logo (scene 2 and end card) -->
  <div id="logo" class="abs" style="inset:0">
    <svg id="mark" class="abs" viewBox="0 0 100 100" width="360" height="360">
      <g transform="translate(5,4)" fill="#FF3D8B">
        <rect x="42" y="8" width="16" height="84" rx="8" transform="rotate(45 50 50)"/>
        <rect x="42" y="8" width="16" height="84" rx="8" transform="rotate(-45 50 50)"/>
      </g>
      <g fill="#C6FF3D">
        <rect x="42" y="8" width="16" height="84" rx="8" transform="rotate(45 50 50)"/>
        <rect x="42" y="8" width="16" height="84" rx="8" transform="rotate(-45 50 50)"/>
      </g>
    </svg>
    <div id="word" class="abs center disp" style="line-height:0.88;letter-spacing:-0.02em">
      <div id="wTafel" style="color:var(--text)">TAFEL</div>
      <div id="wRush" style="color:var(--lime)">RUSH</div>
    </div>
    <div id="tag1" class="abs center"></div>
    <div id="tag2" class="abs center"></div>
  </div>

  <div id="cap" class="abs"></div>

  <div id="vis" class="abs" style="left:0;top:0">
    <div id="phone" class="abs">
      <div id="screen">
        <div id="pTop" class="abs" style="left:56px;right:56px;top:64px;display:flex;justify-content:space-between;align-items:center">
          <span class="pill" style="background:var(--surface);color:var(--muted)">4/10</span>
          <span id="pCombo" class="pill" style="background:var(--surface);color:var(--orange)">COMBO ×3</span>
        </div>
        <div class="abs" style="left:56px;right:56px;top:150px;height:22px;border-radius:11px;background:var(--surface)">
          <div id="pBar" style="height:100%;border-radius:11px;background:var(--lime)"></div>
        </div>
        <div id="pSum" class="abs center disp" style="top:250px;font-size:210px;line-height:1">7×8</div>
        <div id="pQ" class="abs" style="left:48px;top:560px">
          <div class="bubble" style="background:var(--surface);color:var(--text);border-bottom-left-radius:8px">🔊 Zeven keer acht?</div>
        </div>
        <div id="pA" class="abs" style="right:48px;top:720px">
          <div id="pAtext" class="bubble" style="background:var(--lime);color:var(--bg);border-bottom-right-radius:8px"></div>
        </div>
        <div id="pMic" class="abs" style="left:50%;top:960px;width:0;height:0">
          <div id="ring1" class="abs" style="border-radius:50%;border:6px solid var(--cyan)"></div>
          <div id="ring2" class="abs" style="border-radius:50%;border:6px solid var(--cyan)"></div>
          <div id="micDot" class="abs" style="left:-80px;top:-80px;width:160px;height:160px;border-radius:50%;background:var(--cyan);display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 24 24" width="76" height="76"><rect x="8" y="2" width="8" height="13" rx="4" fill="#101018"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4" stroke="#101018" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div id="pListen" class="abs center" style="top:1080px;font-family:'DM Sans';font-weight:700;font-size:36px;color:var(--cyan)"></div>

        <!-- correct overlay -->
        <div id="ok" class="abs" style="inset:0;background:var(--lime);color:var(--bg)">
          <div id="okNum" class="abs center disp" style="top:300px;font-size:330px;line-height:1">56</div>
          <div id="okXp" class="abs center disp" style="top:700px;font-size:84px">+40 XP</div>
          <div id="okCombo" class="abs center" style="top:850px"><span class="pill" style="background:var(--pink);color:var(--text);font-size:44px;padding:18px 40px;font-family:Unbounded;font-weight:900">COMBO ×4</span></div>
        </div>
        <!-- wrong overlay -->
        <div id="bad" class="abs" style="inset:0;background:var(--pink);color:var(--bg)">
          <div id="bruh" class="abs center disp" style="top:200px;font-size:128px;line-height:1"></div>
          <div id="badOld" class="abs center disp" style="top:480px;font-size:130px;color:rgba(16,16,24,0.55)">
            <span style="position:relative;display:inline-block">54<span id="badStrike" class="abs" style="left:-14px;top:52%;height:16px;background:var(--bg);border-radius:8px"></span></span>
          </div>
          <div id="badNew" class="abs center disp" style="top:680px;font-size:280px;line-height:1;color:var(--text)">56</div>
          <div id="badSub" class="abs center" style="top:1010px;font-family:'DM Sans';font-weight:700;font-size:38px;color:var(--bg)">7×8 komt zo terug</div>
        </div>
      </div>
    </div>

    <div id="grid" class="abs"></div>

    <div id="card" class="abs">
      <div id="cardBody" class="abs" style="left:20px;top:80px;width:820px;height:600px;border-radius:48px;background:var(--pink);color:var(--bg);padding:56px 60px">
        <div style="display:flex;align-items:center;gap:28px">
          <div style="width:120px;height:120px;border-radius:50%;background:var(--bg);color:var(--lime);display:flex;align-items:center;justify-content:center;font-family:Unbounded;font-weight:900;font-size:60px">S</div>
          <div>
            <div style="font-family:Unbounded;font-weight:800;font-size:24px;letter-spacing:0.08em;opacity:0.75">UITDAGING</div>
            <div style="font-family:Unbounded;font-weight:900;font-size:46px;line-height:1.1">Sanne daagt<br>je uit</div>
          </div>
        </div>
        <div style="margin-top:44px;font-family:Unbounded;font-weight:900;font-size:76px;line-height:1">8/10 <span style="font-size:48px">in 52 sec</span></div>
        <div style="margin-top:22px;font-family:'DM Sans';font-weight:700;font-size:44px">Kun jij het beter?</div>
        <div style="margin-top:40px;display:inline-block;background:var(--bg);color:var(--lime);border-radius:999px;padding:22px 44px;font-family:Unbounded;font-weight:900;font-size:32px">SPEEL DEZELFDE 10</div>
      </div>
      <div id="sticker" class="abs" style="left:520px;top:700px;width:300px;height:150px;border-radius:30px;background:var(--lime);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-family:Unbounded;font-weight:800;font-size:24px">JIJ</div>
        <div style="font-family:Unbounded;font-weight:900;font-size:64px;line-height:1">?/10</div>
      </div>
      <div id="link" class="abs" style="left:40px;top:740px;font-family:'DM Sans';font-weight:700;font-size:34px;color:var(--muted)">🔗 Zelfde 10 sommen</div>
    </div>
  </div>

  <div id="flash" class="abs"></div>
</div>

<script>
// ---------- params ----------
const Q = new URLSearchParams(location.search);
const FORMAT = Q.get('format') === 'square' ? 'square' : 'vertical';
const W = 1080, H = FORMAT === 'square' ? 1080 : 1920;
const DURATION = 20;
const $ = id => document.getElementById(id);
const stage = $('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outCubic = k => 1 - Math.pow(1 - k, 3);
const inCubic = k => k * k * k;
const outBack = (k, s = 2.2) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const outElastic = k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
const rnd = s => { const x = Math.sin(s * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
const C = { bg: '#101018', surface: '#1C1C28', line: '#2E2E40', text: '#F4F4F8', muted: '#A0A0B8', lime: '#C6FF3D', pink: '#FF3D8B', orange: '#FF9F1C', cyan: '#3DDCFF' };
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
// slam: scale from big to 1 with overshoot, returns {s, o}
const slam = (t, t0, dur = 0.28, from = 2.6) => {
  const k = seg(t, t0, t0 + dur);
  return { s: lerp(from, 1, outBack(k, 1.6)), o: clamp(k * 3), on: t >= t0 };
};
// glitch text: builds main + cyan + pink copies, jittered by frame
function glitch(el, text, t, amount, colors = [C.cyan, C.pink], main = C.text) {
  if (el.dataset.txt !== text) {
    el.innerHTML = `<span class="glitch"><span class="g c1"></span><span class="g c2"></span><span class="m" style="position:relative"></span><span class="g sl"></span></span>`;
    el.querySelectorAll('.g, .m').forEach(s => s.textContent = text);
    el.dataset.txt = text;
  }
  const f = Math.floor(t * 30);
  const [c1, c2, m, sl] = ['.c1', '.c2', '.m', '.sl'].map(q => el.querySelector(q));
  c1.style.color = colors[0] || 'transparent'; c2.style.color = colors[1] || 'transparent'; m.style.color = main; sl.style.color = main;
  const j = (s) => (rnd(f * 7.1 + s) - 0.5) * 2 * amount;
  const off = Math.min(10, 4 + amount * 0.4);
  c1.style.transform = `translate(${-off + j(1)}px, ${j(2) * 0.3}px)`;
  c2.style.transform = `translate(${off + j(3)}px, ${j(4) * 0.3}px)`;
  // a displaced horizontal slice of the main text
  if (amount > 2 && rnd(f * 1.9) > 0.3) {
    const sy = rnd(f * 3.3) * 75, sh = 10 + rnd(f * 5.7) * 20;
    sl.style.display = '';
    sl.style.clipPath = `inset(${sy}% -50px ${Math.max(0, 100 - sy - sh)}% -50px)`;
    sl.style.transform = `translateX(${j(9) * 2.5}px)`;
  } else sl.style.display = 'none';
}

// ---------- layout ----------
const SQ = FORMAT === 'square';
const L = {
  capTop:  SQ ? { x: 90, y: 70, w: 900, h: 170, fs: 50 } : { x: 90, y: 150, w: 900, h: 280, fs: 66 },
  capLeft: SQ ? { x: 90, y: 90, w: 420, h: 900, fs: 62 } : null,
  visTop:  SQ ? { x: 90, y: 260, w: 900, h: 730 } : { x: 90, y: 470, w: 900, h: 1360 },
  visRight:SQ ? { x: 540, y: 90, w: 450, h: 900 } : null,
};
function fitInto(el, nw, nh, box, extraScale = 1, dx = 0, dy = 0, rot = 0) {
  const s = Math.min(box.w / nw, box.h / nh);
  const x = box.x + (box.w - nw * s) / 2, y = box.y + (box.h - nh * s) / 2;
  el.style.transformOrigin = '50% 50%';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.width = nw + 'px'; el.style.height = nh + 'px';
  // scale around element center: translate to top-left first
  el.style.transform = `translate(${(nw * s - nw) / 2 + dx}px, ${(nh * s - nh) / 2 + dy}px) scale(${s * extraScale}) rotate(${rot}deg)`;
}
const cap = $('cap');
function caption(t, t0, text, mode) {
  const box = (mode === 'left' && L.capLeft) ? L.capLeft : L.capTop;
  const k = seg(t, t0, t0 + 0.3);
  cap.style.display = '';
  cap.style.left = box.x + 'px'; cap.style.top = box.y + 'px';
  cap.style.width = box.w + 'px'; cap.style.height = box.h + 'px';
  cap.style.justifyContent = (mode === 'left' && L.capLeft) ? 'flex-start' : 'center';
  cap.style.textAlign = (mode === 'left' && L.capLeft) ? 'left' : 'center';
  if (cap.dataset.txt !== text) {
    cap.innerHTML = `<div>${text}</div>`; cap.dataset.txt = text;
    let fs = box.fs; cap.style.fontSize = fs + 'px';
    const inner = cap.firstChild;
    while ((inner.scrollHeight > box.h || inner.scrollWidth > box.w) && fs > 20) { fs -= 2; cap.style.fontSize = fs + 'px'; }
  }
  cap.style.opacity = clamp(k * 2);
  cap.style.transform = `translateY(${(1 - outCubic(k)) * 40}px)`;
}

// ---------- grid data ----------
const RANK = [C.line, '#C9824A', '#BFC7D5', '#FFC93D', '#7FE3D8', '#C6FF3D'];
const BOSSES = [[7, 8], [6, 7], [8, 9], [6, 8], [7, 9], [4, 8], [9, 6]];
const grid = $('grid');
const cells = [];
for (let a = 1; a <= 10; a++) for (let b = 1; b <= 10; b++) {
  const d = document.createElement('div'); d.className = 'cell';
  d.style.left = ((b - 1) * 90 + 5) + 'px'; d.style.top = ((a - 1) * 90 + 5) + 'px';
  d.textContent = `${a}×${b}`;
  grid.appendChild(d);
  const boss = BOSSES.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
  // easy sums end high, harder ones lower
  const hard = (a > 5 && b > 5) ? 1 : 0;
  let rank = 5 - Math.floor(rnd(a * 13 + b * 7) * (hard ? 3.2 : 2.2)) - hard;
  if (a === 1 || b === 1 || a === 10 || b === 10) rank = 5;
  rank = Math.max(1, Math.min(5, rank));
  cells.push({ d, a, b, boss, rank, delay: ((a - 1) + (b - 1)) * 0.075 + rnd(a * 3 + b) * 0.12 });
}
const legend = document.createElement('div');
legend.className = 'abs';
legend.style.cssText = 'left:0;right:0;top:940px;display:flex;justify-content:center;gap:14px';
['brons', 'zilver', 'goud', 'platina', 'diamant'].forEach((n, i) => {
  const s = document.createElement('span'); s.className = 'pill';
  s.style.cssText = `background:${C.surface};color:${RANK[i + 1]};font-size:22px;padding:12px 18px;font-family:'DM Sans';font-weight:700`;
  s.textContent = '● ' + n; legend.appendChild(s);
});
const bossTag = document.createElement('span'); bossTag.className = 'pill';
bossTag.style.cssText = `background:${C.surface};color:${C.pink};font-size:22px;padding:12px 18px;font-family:'DM Sans';font-weight:700`;
bossTag.textContent = '◻ boss'; legend.appendChild(bossTag);
grid.appendChild(legend);

// ---------- timeline ----------
const T = {
  s1: 0, saai: 1.0, strike: 1.5,
  s2: 2.0, word: 2.25,
  s3: 4.0, q: 4.5, listen: 5.5, ans: 6.25, ok: 7.25,
  s4: 8.5, ans2: 8.55, bad: 9.0,
  s5: 11.0, boss: 13.0,
  s6: 14.0, sticker: 15.5,
  s7: 17.0,
};

function setPhoneTimer(f) {
  // f: 1 full -> 0 empty. lime -> orange -> pink
  const col = f > 0.5 ? mix(C.orange, C.lime, (f - 0.5) * 2) : mix(C.pink, C.orange, f * 2);
  $('pBar').style.width = (f * 100) + '%';
  $('pBar').style.background = col;
  $('phone').style.borderColor = col;
  $('screen').style.background = `radial-gradient(120% 60% at 50% 0%, ${col.replace('rgb', 'rgba').replace(')', ',0.16)')}, ${C.bg} 70%)`;
}

function renderPhone(t, wrong) {
  const base = wrong ? T.s4 : T.s3;
  // timer
  const tStart = wrong ? T.s4 : T.q, tEnd = wrong ? T.s4 + 1.6 : T.ok + 0.9;
  const tf = wrong ? lerp(0.45, 0.12, seg(t, tStart, T.bad)) : 1 - seg(t, tStart, tEnd);
  setPhoneTimer(tf);
  $('pCombo').textContent = wrong ? 'COMBO ×4' : 'COMBO ×3';
  // sum
  const sk = wrong ? 1 : seg(t, T.s3 + 0.25, T.s3 + 0.5);
  $('pSum').style.transform = `scale(${wrong ? 1 : lerp(2.2, 1, outBack(sk, 1.5))})`;
  $('pSum').style.opacity = wrong ? 1 : clamp(sk * 3);
  // question bubble
  const qk = wrong ? 1 : seg(t, T.q, T.q + 0.25);
  $('pQ').style.opacity = qk; $('pQ').style.transform = `translateY(${(1 - outBack(qk)) * 40}px) scale(${lerp(0.7, 1, outBack(qk))})`;
  $('pQ').style.transformOrigin = '0 100%';
  // answer typing
  const word = wrong ? 'vierenvijftig' : 'zesenvijftig';
  const a0 = wrong ? T.ans2 : T.ans, a1 = wrong ? T.bad - 0.1 : T.ok - 0.25;
  const n = Math.floor(seg(t, a0, a1) * word.length + 0.0001);
  show($('pA'), t >= a0);
  const caret = (Math.floor(t * 4) % 2 === 0 && n < word.length) ? '▍' : '';
  $('pAtext').textContent = word.slice(0, Math.max(1, n)) + caret;
  // mic
  const listening = wrong ? true : t >= T.listen - 0.6;
  const mk = wrong ? 1 : seg(t, T.listen - 0.6, T.listen - 0.35);
  $('pMic').style.opacity = mk;
  $('pMic').style.transform = `scale(${lerp(0.4, 1, outBack(mk))})`;
  const beat = ((t - 0) % 0.5) / 0.5;
  const pulse = 1 + 0.08 * Math.pow(1 - beat, 3);
  $('micDot').style.transform = `scale(${pulse})`;
  [['ring1', 0], ['ring2', 0.5]].forEach(([id, off]) => {
    const p = ((t + off) % 1);
    const r = 80 + p * 90; const el = $(id);
    el.style.left = -r + 'px'; el.style.top = -r + 'px'; el.style.width = 2 * r + 'px'; el.style.height = 2 * r + 'px';
    el.style.opacity = listening ? (1 - p) * 0.8 : 0;
  });
  const dots = '.'.repeat(1 + (Math.floor(t * 4) % 3));
  $('pListen').textContent = listening ? 'Luistert' + dots : '';
  $('pListen').style.opacity = mk;

  // overlays
  const okOn = !wrong && t >= T.ok;
  show($('ok'), okOn);
  if (okOn) {
    const k = seg(t, T.ok, T.ok + 0.3);
    $('okNum').style.transform = `scale(${lerp(2.4, 1, outBack(k, 1.8))})`;
    const xk = seg(t, T.ok + 0.2, T.ok + 0.45);
    $('okXp').style.opacity = clamp(xk * 3); $('okXp').style.transform = `translateY(${(1 - outBack(xk)) * 60}px)`;
    const ck = seg(t, T.ok + 0.45, T.ok + 0.7);
    $('okCombo').style.opacity = clamp(ck * 3); $('okCombo').style.transform = `scale(${lerp(2.2, 1, outBack(ck, 2))}) rotate(${lerp(-12, -4, ck)}deg)`;
  }
  const badOn = wrong && t >= T.bad;
  show($('bad'), badOn);
  if (badOn) {
    const gl = t < T.bad + 0.6 ? 14 : (Math.floor(t * 30) % 17 === 0 ? 10 : 2);
    glitch($('bruh'), 'BRUH.', t, gl, [C.cyan, null], C.bg);
    const bk = seg(t, T.bad, T.bad + 0.25);
    $('bruh').style.transform = `scale(${lerp(1.8, 1, outBack(bk, 1.6))})`;
    const sk2 = seg(t, T.bad + 0.35, T.bad + 0.6);
    $('badStrike').style.width = (outCubic(sk2) * 120) + '%';
    const nk = seg(t, T.bad + 0.7, T.bad + 1.0);
    $('badNew').style.opacity = clamp(nk * 3); $('badNew').style.transform = `scale(${lerp(2.2, 1, outBack(nk, 1.8))})`;
    const sbk = seg(t, T.bad + 1.1, T.bad + 1.35);
    $('badSub').style.opacity = sbk;
  }
}

function renderGrid(t) {
  const t0 = T.s5 + 0.3;
  cells.forEach(c => {
    const k = seg(t, t0 + c.delay, t0 + c.delay + 0.35);
    let col = C.line, txt = C.muted, scale = 1, outline = 'none';
    if (c.boss) {
      // bosses stay grey with pink outline until T.boss, then turn gold
      const bk = seg(t, T.boss + c.delay * 0.25, T.boss + c.delay * 0.25 + 0.3);
      if (bk > 0) { col = RANK[3]; txt = C.bg; scale = lerp(1.6, 1, outBack(bk, 2)); }
      else if (k > 0) { outline = `inset 0 0 0 5px ${C.pink}`; txt = C.pink; scale = 1 + 0.06 * Math.sin(t * 12.566); }
    } else if (k > 0) {
      // climb through ranks up to the target
      const r = Math.max(1, Math.ceil(k * c.rank));
      col = RANK[r]; txt = C.bg; scale = lerp(1.35, 1, outBack(k, 2));
    }
    c.d.style.background = col; c.d.style.color = txt; c.d.style.boxShadow = outline;
    c.d.style.transform = `scale(${scale})`;
    c.d.style.zIndex = scale > 1.01 ? 2 : 1;
  });
  legend.style.opacity = seg(t, T.s5 + 1.2, T.s5 + 1.5);
}

function render(t) {
  const sceneOf = t < T.s2 ? 1 : t < T.s3 ? 2 : t < T.s4 ? 3 : t < T.s5 ? 4 : t < T.s6 ? 5 : t < T.s7 ? 6 : 7;
  show($('s1'), sceneOf === 1);
  show($('logo'), sceneOf === 2 || sceneOf === 7);
  show(cap, sceneOf >= 3 && sceneOf <= 6);
  show($('vis'), sceneOf >= 3 && sceneOf <= 6);
  show($('phone'), sceneOf === 3 || sceneOf === 4);
  show($('grid'), sceneOf === 5);
  show($('card'), sceneOf === 6);
  const flash = $('flash'); flash.style.background = 'transparent'; flash.style.opacity = 0;
  const bgfx = $('bgfx'); bgfx.style.background = 'none';
  stage.style.transform = '';
  const cy = H / 2;

  if (sceneOf === 1) {
    const a = $('s1a'), b = $('s1b'), st = $('s1strike');
    const fsA = 140;
    a.style.fontSize = fsA + 'px'; a.style.top = (cy - 230) + 'px';
    const on = t >= 0.08;
    a.style.opacity = on ? 1 : 0;
    const g = t < 0.4 ? 16 : (rnd(Math.floor(t * 30)) > 0.8 ? 12 : 3);
    glitch(a, 'TAFELS?', t, g);
    const s = slam(t, T.saai, 0.24, 3);
    b.style.fontSize = '170px'; b.style.top = (cy - 10) + 'px';
    b.style.lineHeight = 1; a.style.lineHeight = 1;
    b.style.opacity = s.on ? s.o : 0;
    b.style.transform = `scale(${s.s})`;
    glitch(b, 'SAAI.', t, t < T.strike ? 0 : 2, [null, null], C.text);
    const sk = seg(t, T.strike, T.strike + 0.12);
    st.style.left = '150px'; st.style.top = (cy - 10 + 70) + 'px';
    st.style.height = '30px'; st.style.width = (outCubic(sk) * 780) + 'px';
    st.style.transform = 'rotate(-6deg)'; st.style.transformOrigin = '0 50%';
    if (t >= T.strike && t < T.strike + 0.25) { const k = seg(t, T.strike, T.strike + 0.25); stage.style.transform = `translate(${(rnd(t * 99) - 0.5) * 40 * (1 - k)}px, ${(rnd(t * 77) - 0.5) * 30 * (1 - k)}px)`; }
    if (s.on && t < T.saai + 0.15) { flash.style.background = C.text; flash.style.opacity = 0.25 * (1 - seg(t, T.saai, T.saai + 0.15)); }
  }

  if (sceneOf === 2 || sceneOf === 7) {
    const t0 = sceneOf === 2 ? T.s2 : T.s7;
    const end = sceneOf === 7;
    const mark = $('mark'), word = $('word');
    const ms = end ? 260 : 380;
    const mk = seg(t, t0, t0 + 0.32);
    const sc = lerp(4, 1, outBack(mk, 1.8));
    const rot = lerp(-90, 0, outBack(mk, 1.4));
    const markY = end ? cy - (SQ ? 420 : 560) : cy - (SQ ? 400 : 470);
    mark.setAttribute('width', ms); mark.setAttribute('height', ms);
    mark.style.left = (W / 2 - ms / 2) + 'px'; mark.style.top = markY + 'px';
    mark.style.transform = `scale(${sc}) rotate(${rot}deg)`;
    mark.style.opacity = clamp(mk * 4);
    // after-beat pulse
    const pb = ((t - t0) % 0.5) / 0.5;
    if (t > t0 + 0.4) mark.style.transform = `scale(${1 + 0.05 * Math.pow(1 - pb, 4)})`;
    const wt = end ? t0 + 0.2 : T.word;
    const fs = SQ ? (end ? 120 : 140) : (end ? 140 : 170);
    word.style.fontSize = fs + 'px';
    word.style.top = (markY + ms + (SQ ? 20 : 50)) + 'px';
    const tk = seg(t, wt, wt + 0.22), rk = seg(t, wt + 0.12, wt + 0.34);
    $('wTafel').style.transform = `translateX(${(1 - outBack(tk, 1.3)) * -900}px)`;
    $('wRush').style.transform = `translateX(${(1 - outBack(rk, 1.3)) * 900}px)`;
    // shake on slam
    if (t >= t0 && t < t0 + 0.3) { const k = seg(t, t0, t0 + 0.3); stage.style.transform = `translate(${(rnd(t * 91) - 0.5) * 50 * (1 - k)}px, ${(rnd(t * 57) - 0.5) * 50 * (1 - k)}px)`; }
    if (t < t0 + 0.12) { flash.style.background = C.lime; flash.style.opacity = 0.8 * (1 - seg(t, t0, t0 + 0.12)); }
    bgfx.style.background = `radial-gradient(60% 40% at 50% ${(markY + ms / 2) / H * 100}%, rgba(198,255,61,${0.10 + 0.08 * Math.pow(1 - pb, 3)}), transparent 70%)`;
    const t1 = $('tag1'), t2 = $('tag2');
    t1.style.display = 'block'; t2.style.display = 'block';
    const wordBottom = markY + ms + (SQ ? 20 : 50) + fs * 0.88 * 2;
    if (end) {
      t1.innerHTML = `<span class="pill" style="background:${C.lime};color:${C.bg};font-family:Unbounded;font-weight:900;font-size:${SQ ? 34 : 38}px;padding:24px 40px">Gratis voor iPhone en Android</span>`;
      t2.innerHTML = `<span style="font-family:'DM Sans';font-weight:700;font-size:${SQ ? 46 : 54}px;color:${C.text}">tafelrush.nl</span>`;
      t1.style.top = (wordBottom + (SQ ? 40 : 80)) + 'px';
      t2.style.top = (wordBottom + (SQ ? 170 : 240)) + 'px';
      const ak = seg(t, t0 + 0.6, t0 + 0.9), bk = seg(t, t0 + 1.0, t0 + 1.3);
      t1.style.opacity = clamp(ak * 3); t1.style.transform = `scale(${lerp(1.8, 1, outBack(ak, 1.8))})`;
      t2.style.opacity = clamp(bk * 3); t2.style.transform = `translateY(${(1 - outCubic(bk)) * 40}px)`;
      // fade to black at the very end
      flash.style.background = C.bg; flash.style.opacity = seg(t, DURATION - 0.25, DURATION);
    } else {
      t1.innerHTML = `<span style="font-family:'DM Sans';font-weight:700;font-size:${SQ ? 40 : 48}px;color:${C.muted}">De tafels. Maar dan snel.</span>`;
      t2.innerHTML = '';
      t1.style.top = (wordBottom + (SQ ? 40 : 90)) + 'px';
      const ak = seg(t, t0 + 0.9, t0 + 1.15);
      t1.style.opacity = ak; t1.style.transform = `translateY(${(1 - outCubic(ak)) * 30}px)`;
    }
  }

  if (sceneOf === 3 || sceneOf === 4) {
    const wrong = sceneOf === 4;
    caption(t, wrong ? T.s4 : T.s3, wrong ? 'Fout? Hij komt <span class="hl">terug</span> tot hij zit.' : 'Zeg het gewoon <span class="hl">hardop.</span>', 'left');
    const box = L.visRight || L.visTop;
    const pk = wrong ? 1 : seg(t, T.s3, T.s3 + 0.35);
    let dx = 0, dy = (1 - outBack(pk, 1.2)) * (H * 0.7);
    if (wrong && t >= T.bad && t < T.bad + 0.5) {
      const k = seg(t, T.bad, T.bad + 0.5);
      dx = Math.sin(k * 40) * 34 * (1 - k); dy = (rnd(t * 33) - 0.5) * 16 * (1 - k);
    }
    fitInto($('phone'), 640, 1240, box, 1, dx, dy, (1 - pk) * 8);
    renderPhone(t, wrong);
    if (!wrong && t >= T.ok && t < T.ok + 0.5) {
      const k = seg(t, T.ok, T.ok + 0.5);
      flash.style.background = C.lime; flash.style.opacity = 0.75 * (1 - outCubic(k));
    }
    if (!wrong && t >= T.ok) bgfx.style.background = `radial-gradient(70% 50% at 50% 60%, rgba(198,255,61,0.22), transparent 70%)`;
    if (wrong && t >= T.bad) {
      const k = seg(t, T.bad, T.bad + 0.5);
      if (k < 1) { flash.style.background = C.pink; flash.style.opacity = 0.7 * (1 - outCubic(k)); }
      bgfx.style.background = `radial-gradient(70% 50% at 50% 60%, rgba(255,61,139,0.25), transparent 70%)`;
      if (t < T.bad + 0.5) stage.style.transform = `translate(${Math.sin(k * 50) * 18 * (1 - k)}px, 0)`;
    }
    // quick white cut flash at scene 4 start
    if (wrong && t < T.s4 + 0.08) { flash.style.background = C.text; flash.style.opacity = 0.35; }
  }

  if (sceneOf === 5) {
    caption(t, T.s5, 'Slim oefenen. Wat lastig is, komt <span class="hl">vaker.</span>', 'top');
    const k = seg(t, T.s5, T.s5 + 0.3);
    fitInto(grid, 900, 1000, L.visTop, lerp(0.85, 1, outBack(k, 1.5)), 0, 0, 0);
    grid.style.opacity = clamp(k * 3);
    renderGrid(t);
    if (t >= T.boss && t < T.boss + 0.3) { flash.style.background = '#FFC93D'; flash.style.opacity = 0.25 * (1 - seg(t, T.boss, T.boss + 0.3)); }
  }

  if (sceneOf === 6) {
    caption(t, T.s6, 'Daag je <span class="hl">vrienden</span> uit.', 'top');
    const k = seg(t, T.s6 + 0.15, T.s6 + 0.55);
    fitInto($('card'), 860, 900, L.visTop, 1, (1 - outBack(k, 1.3)) * 1200, 0, lerp(14, -3, outBack(k, 1.3)));
    const sk = seg(t, T.sticker, T.sticker + 0.25);
    $('sticker').style.opacity = clamp(sk * 3);
    $('sticker').style.transform = `scale(${lerp(2.5, 1, outBack(sk, 2))}) rotate(${lerp(-30, 8, outBack(sk, 1.2))}deg)`;
    const lk = seg(t, T.s6 + 0.8, T.s6 + 1.1);
    $('link').style.opacity = lk;
    bgfx.style.background = `radial-gradient(70% 45% at 50% 55%, rgba(255,61,139,0.18), transparent 70%)`;
  }

  // quick cut flash at each scene start (on the beat)
  for (const c of [T.s3, T.s5, T.s6]) if (t >= c && t < c + 0.06) { flash.style.background = C.text; flash.style.opacity = 0.3; }
}

window.render = render;
window.DURATION = DURATION;
window.FORMAT = FORMAT;
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load("900 40px Unbounded"), document.fonts.load("800 40px Unbounded"),
  document.fonts.load("700 40px 'DM Sans'"), document.fonts.load("500 40px 'DM Sans'")]));
// preview: ?t=7.5 renders a single time
if (Q.has('t')) window.ready.then(() => render(parseFloat(Q.get('t'))));
</script>
</body>
