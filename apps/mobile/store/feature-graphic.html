<!doctype html>
<!-- Play Store feature graphic, 1024x500. Render: see store/README.md -->
<html lang="nl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Unbounded'; font-weight: 900; src: url('../node_modules/@expo-google-fonts/unbounded/900Black/Unbounded_900Black.ttf'); }
@font-face { font-family: 'DM Sans'; font-weight: 700; src: url('../node_modules/@expo-google-fonts/dm-sans/700Bold/DMSans_700Bold.ttf'); }
html, body { margin: 0; }
body { width: 1024px; height: 500px; background: #101018; color: #F4F4F8; font-family: 'DM Sans', sans-serif; overflow: hidden; position: relative; }
.left { position: absolute; left: 64px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.word { font-family: 'Unbounded'; font-weight: 900; font-size: 96px; line-height: 0.9; letter-spacing: -3px; }
.word span { color: #C6FF3D; }
.tag { font-size: 28px; max-width: 470px; line-height: 1.25; }
.phone { position: absolute; right: 70px; top: 46px; width: 250px; height: 520px; border-radius: 40px; border: 6px solid #C6FF3D; background: #0F1A12; box-sizing: border-box; padding: 26px 20px; display: flex; flex-direction: column; gap: 16px; transform: rotate(6deg); }
.bar { height: 10px; border-radius: 99px; background: #2E2E40; }
.bar div { width: 68%; height: 100%; border-radius: 99px; background: #C6FF3D; }
.sum { font-family: 'Unbounded'; font-weight: 900; font-size: 68px; text-align: center; letter-spacing: -2px; margin-top: 18px; }
.bub { font-size: 17px; padding: 10px 14px; border-radius: 16px; max-width: 80%; }
.app { background: #1C1C28; align-self: flex-start; border-bottom-left-radius: 5px; }
.me { border: 2px dashed #C6FF3D; align-self: flex-end; border-bottom-right-radius: 5px; }
.mark { position: absolute; right: 300px; top: 300px; transform: rotate(-12deg); }
.chip { position: absolute; right: 250px; top: 120px; background: #FF3D8B; color: #101018; font-family: 'Unbounded'; font-weight: 900; font-size: 22px; padding: 10px 18px; border-radius: 99px; transform: rotate(-6deg); }
</style>
</head>
<body>
  <div class="left">
    <div class="word">TAFEL<br><span>RUSH</span></div>
    <div class="tag">De app zegt de som. Jij zegt het antwoord. Hardop.</div>
  </div>
  <div class="phone">
    <div class="bar"><div></div></div>
    <div class="sum">7×8</div>
    <div class="bub app">Zeven keer acht?</div>
    <div class="bub me">zesenvijftig</div>
  </div>
  <div class="chip">COMBO ×4</div>
  <svg class="mark" width="120" height="120" viewBox="0 0 100 100">
    <g transform="translate(5 4)">
      <rect x="42" y="8" width="16" height="84" rx="8" fill="#FF3D8B" transform="rotate(45 50 50)"/>
      <rect x="42" y="8" width="16" height="84" rx="8" fill="#FF3D8B" transform="rotate(-45 50 50)"/>
    </g>
    <rect x="42" y="8" width="16" height="84" rx="8" fill="#C6FF3D" transform="rotate(45 50 50)"/>
    <rect x="42" y="8" width="16" height="84" rx="8" fill="#C6FF3D" transform="rotate(-45 50 50)"/>
  </svg>
</body>
</html>
